[workspace]
members = [
    "crates/use-math",
    "crates/use-geometry",
    "crates/use-combinatorics",
    "crates/use-series",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/RustUse/use-math"
rust-version = "1.95.0"
version = "0.0.1"

[workspace.dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-geometry",
    "use-combinatorics",
    "use-series",
    "use-math",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
