[workspace]
members = [
    "crates/use-math",
    "crates/use-arithmetic",
    "crates/use-geometry",
    "crates/use-combinatorics",
    "crates/use-number",
    "crates/use-integer",
    "crates/use-rational",
    "crates/use-real",
    "crates/use-interval",
    "crates/use-complex",
    "crates/use-series",
    "crates/use-catalan",
    "crates/use-geode",
    "crates/use-algebra",
    "crates/use-matrix",
    "crates/use-linear",
    "crates/use-vector",
    "crates/use-calculus",
    "crates/use-probability",
    "crates/use-statistics",
    "crates/use-trigonometry",
    "crates/use-logic",
    "crates/use-set",
]
resolver = "2"

[workspace.package]
authors = ["RustUse Contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/RustUse/use-math"
rust-version = "1.95.0"
version = "0.0.4"

[workspace.dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[workspace.metadata.rustuse.release]
publish = false
versioning = "lockstep-0.x"
first-publish-candidates = [
    "use-arithmetic",
    "use-number",
    "use-integer",
    "use-rational",
    "use-interval",
    "use-real",
    "use-complex",
    "use-geometry",
    "use-combinatorics",
    "use-series",
    "use-catalan",
    "use-geode",
    "use-algebra",
    "use-vector",
    "use-matrix",
    "use-linear",
    "use-calculus",
    "use-probability",
    "use-statistics",
    "use-trigonometry",
    "use-logic",
    "use-set",
    "use-math",
]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
expect_used = "warn"
multiple_crate_versions = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
