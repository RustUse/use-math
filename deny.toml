[graph]
all-features = true

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = []

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "warn"

# Allow only third-party licenses you accept globally.
allow = [
	"Apache-2.0",
	"MIT",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unicode-3.0",
]

[licenses.private]
# Ignore license-expression checks for your unpublished private workspace crates.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = [
	"https://github.com/rust-lang/crates.io-index",
	"sparse+https://index.crates.io/",
]

