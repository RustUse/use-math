[package]
name = "use-linear"
description = "Utility-first linear-algebra scaffolding for RustUse"
publish = true
authors.workspace = true
version = "0.0.8"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage = "https://github.com/RustUse/use-math"
documentation = "https://docs.rs/use-linear"
keywords = ["math", "linear", "matrix", "vector", "algebra"]
categories = ["mathematics", "science"]

[dependencies]
use-matrix = { version = "0.0.8", path = "../use-matrix" }
use-vector = { version = "0.0.8", path = "../use-vector" }

[[example]]
name = "use-linear-2d-basics"
path = "examples/basic_usage.rs"

[lints]
workspace = true
