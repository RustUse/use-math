name: Facade Publish Readiness

on:
    workflow_dispatch:
        inputs:
            registry-ready:
                description: Confirm that matching use-geometry and use-combinatorics versions are live on crates.io
                required: true
                type: boolean

permissions:
    contents: read

jobs:
    facade-release-readiness:
        if: ${{ inputs.registry-ready }}
        name: Facade Publish Dry Run
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Install stable Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@v1
              with:
                  rustflags: ""
                  cache-workspaces: |
                      . -> target

            - name: List packaged facade files
              run: cargo package --list -p use-math

            - name: Dry-run publish use-math
              run: cargo publish --dry-run --allow-dirty -p use-math
