name: Docs request
description: Request README, crate docs, examples, or onboarding improvements.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Root README
        - Crate README
        - API docs
        - Examples
        - Contributor onboarding
        - Release or operations docs
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is missing or unclear?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would make it clearer?
      description: Describe the example, explanation, or reorganization you expected.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who is blocked by this?
      description: New users, contributors, maintainers, or downstream consumers.
